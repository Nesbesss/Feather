name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Unit tests
        run: >-
          xcodebuild -project Feather.xcodeproj -scheme Feather
          -destination 'platform=macOS' -derivedDataPath build/ci
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER=
          test
      - name: Universal release build
        run: Tools/Release/build.sh --output-dir build/ci-release
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
